spring:
  application:
    name: order-management-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/orders}
    username: ${DB_USERNAME:orders}
    password: ${DB_PASSWORD:orders}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration

app:
  jwt:
    # Em produção, defina JWT_SECRET com pelo menos 32 caracteres
    secret: ${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
    issuer: order-management-api
    expiration: ${JWT_EXPIRATION:2h}
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html
